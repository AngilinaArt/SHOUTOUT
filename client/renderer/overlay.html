<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data: http: https:; media-src 'self' file: data: http: https:; connect-src 'self' file: http: https:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
    <title>Shoutout – Overlay</title>
    <link
      rel="stylesheet"
      href="style.css" />
  </head>
  <body>
    <div id="container">
      <div
        id="hamster"
        class="hidden">
        <img
          id="hamster-img"
          alt="hamster" />
        <div
          id="hamster-badge"
          class="badge hidden"></div>
      </div>
      <div
        id="toast"
        class="hidden">
      </div>
      <div id="sound-indicator" class="hidden" aria-hidden="true">
        <img id="sound-indicator-img" alt="app sound" />
        <div id="sound-sender" class="sound-sender hidden"></div>
        <button id="sound-cancel-btn" title="Stop">✖ Stop</button>
      </div>
    </div>
    <!-- <script src="overlay.js"></script> -->
    <script src="overlay-new.js"></script>
    <!-- <script src="toast-debug.js"></script> -->
  </body>
</html>
